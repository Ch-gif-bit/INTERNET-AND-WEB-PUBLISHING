<!DOCTYPE html>
<html lang="en">
<head>
    <title>Checkout - Review Order</title>
    <link rel="stylesheet" href="styles/checkout.css"> 
    <link rel="stylesheet" href="styles/header.css">
</head>
<body>
    <div class="header">
        <div class="left-section"><p class="home">Logo</p></div>
        <div class="middle-section">
            <a href="index.html" class="nav-link"><p>Home</p></a>
            <p>Shop</p><p>About</p><p>Contact</p>
        </div>
        <div class="right-section">
            <div class="cart-container">
                <a href="cart.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
                    <img src="images/shopping cart.png" class="Shopping-Cart">
                    <div class="cart-number">0</div>
                </a>
            </div>
        </div>
    </div>

    <div class="header-spacer" style="height: 80px;"></div>

    <div class="checkout-wrapper">
        <div class="checkout-steps">
            <div class="step"><span>1</span> Shipping</div>
            <div class="step"><span>2</span> Billing</div>
            <div class="step active"><span>3</span> Review</div>
        </div>

        <div class="checkout-container">
            <div class="checkout-left">
                <div class="white-card">
                    <h2>Review Your Order</h2>
                    
                    <div class="review-section" style="margin-bottom: 30px;">
                        <h3 style="display:flex; justify-content:space-between; align-items:center;">
                            Shipping Details
                            <a href="checkout-shipping.html" style="font-size:12px; color:#4a90e2; text-decoration:none;">Edit</a>
                        </h3>
                        <div id="review-shipping-info" class="info-display-box" style="background:#f9f9f9; padding:15px; border-radius:4px; line-height:1.6;">
                            </div>
                    </div>

                    <div class="review-section" style="margin-bottom: 30px;">
                        <h3 style="display:flex; justify-content:space-between; align-items:center;">
                            Payment Method
                            <a href="checkout-billing.html" style="font-size:12px; color:#4a90e2; text-decoration:none;">Edit</a>
                        </h3>
                        <div id="review-payment-info" class="info-display-box" style="background:#f9f9f9; padding:15px; border-radius:4px;">
                            </div>
                    </div>

                    <p style="font-size: 13px; color: #888; margin-bottom: 20px;">
                        By clicking "Place Order", you agree to our Terms and Conditions.
                    </p>

                    <button class="primary-black-btn" onclick="completeOrder()">
                        PLACE ORDER
                    </button>
                </div>
            </div>

            <div class="checkout-right">
                <div class="white-card summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-line">
                        <span>Items</span>
                        <span id="items-count">0</span>
                    </div>
                    <div class="summary-line total-line">
                        <span>Total</span>
                        <span id="grand-total">RM 0.00</span>
                    </div>
                    <hr>
                    <h3>Order Details</h3>
                    <div id="checkout-item-details"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/checkout-review.js"></script>
</body>
</html>
